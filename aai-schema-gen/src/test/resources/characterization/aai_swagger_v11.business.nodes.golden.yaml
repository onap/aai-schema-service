swagger: "2.0"
info:
  description: |
    [Differences versus the previous schema version](apidocs/aai/aai_swagger_v11.diff)

    This document is best viewed with Firefox or Chrome. Nodes can be found by opening the models link below and finding the node-type. Edge definitions can be found with the node definitions.
  version: v11
  title: Active and Available Inventory REST API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
host: localhost
basePath: /aai/v11
schemes:
  - https
paths:
  /nodes/customers/customer/{global-customer-id}:
    get:
      tags:
        - Operations
      summary: returns customer
      description: returns customer
      operationId: getBusinessCustomersCustomer
      produces:
        - application/json
        - application/xml
      responses:
        "200":
          description: successful operation
          schema:
            $ref: "#/definitions/customer"
        "default":
          description: Response codes are uniform across all endpoints.
      parameters:
        - name: global-customer-id
          in: path
          description: Global customer id used across to uniquely identify customer.
          required: true
          type: string
  /nodes/customers?parameter=value[&parameter2=value2]:
    get:
      tags:
        - Operations
      summary: returns customers
      description: returns customers
      operationId: getBusinessCustomers
      produces:
        - application/json
        - application/xml
      responses:
        "200":
          description: successful operation
          schema:
            $ref: "#/definitions/customers"
        "default":
          description: Response codes are uniform across all endpoints.
      parameters:
        - name: global-customer-id
          in: query
          required: false
          type: string
        - name: subscriber-name
          in: query
          required: false
          type: string
        - name: subscriber-type
          in: query
          required: false
          type: string
  /nodes/service-subscriptions/service-subscription/{service-type}:
    get:
      tags:
        - Operations
      summary: returns service-subscription
      description: returns service-subscription
      operationId: getBusinessCustomersCustomerServiceSubscriptionsServiceSubscription
      produces:
        - application/json
        - application/xml
      responses:
        "200":
          description: successful operation
          schema:
            $ref: "#/definitions/service-subscription"
        "default":
          description: Response codes are uniform across all endpoints.
      parameters:
        - name: service-type
          in: path
          description: Value defined by orchestration to identify this service.
          required: true
          type: string
  /nodes/service-subscriptions?parameter=value[&parameter2=value2]:
    get:
      tags:
        - Operations
      summary: returns service-subscriptions
      description: returns service-subscriptions
      operationId: getBusinessCustomersCustomerServiceSubscriptions
      produces:
        - application/json
        - application/xml
      responses:
        "200":
          description: successful operation
          schema:
            $ref: "#/definitions/service-subscriptions"
        "default":
          description: Response codes are uniform across all endpoints.
      parameters:
        - name: service-type
          in: query
          required: false
          type: string
definitions:
  business:
    description: |
      Namespace for business related constructs
    properties:
      customers:
        type: object
        properties:
          customer:
            type: array
            items:
              $ref: "#/definitions/customer"
  customer:
    description: |
      customer identifiers to provide linkage back to BSS information.
      ###### Related Nodes
      - FROM service-subscription (CHILD of customer, service-subscription BelongsTo customer, MANY2ONE)(1)

      -(1) IF this CUSTOMER node is deleted, this FROM node is DELETED also
    required:
      - global-customer-id
      - subscriber-name
      - subscriber-type
    properties:
      global-customer-id:
        type: string
        description: Global customer id used across to uniquely identify customer.
      subscriber-name:
        type: string
        description: Subscriber name, an alternate way to retrieve a customer.
      subscriber-type:
        type: string
        description: Subscriber type, a way to provide VID with only the INFRA customers.
      resource-version:
        type: string
        description: Used for optimistic concurrency.  Must be empty on create, valid on update and delete.
      service-subscriptions:
        type: object
        properties:
          service-subscription:
            type: array
            items:
              $ref: "#/definitions/service-subscription"
  customers:
    description: |
      Collection of customer identifiers to provide linkage back to BSS information.
    properties:
      customer:
        type: array
        items:
          $ref: "#/definitions/customer"
  inventory:
    properties:
      business:
        $ref: "#/definitions/business"
  nodes:
    properties:
      inventory-item-data:
        type: array
        items:
          $ref: "#/definitions/inventory-item-data"
  service-subscription:
    description: |
      Object that group service instances.
      ###### Related Nodes
      - TO customer (PARENT of service-subscription, service-subscription BelongsTo customer, MANY2ONE)(4)
      - TO tenant( service-subscription Uses tenant, MANY2MANY)
      - FROM service-instance (CHILD of service-subscription, service-instance BelongsTo service-subscription, MANY2ONE)(1)

      -(1) IF this SERVICE-SUBSCRIPTION node is deleted, this FROM node is DELETED also
      -(4) IF this TO node is deleted, this SERVICE-SUBSCRIPTION is DELETED also
    required:
      - service-type
    properties:
      service-type:
        type: string
        description: Value defined by orchestration to identify this service.
      temp-ub-sub-account-id:
        type: string
        description: This property will be deleted from A&AI in the near future. Only stop gap solution.
      resource-version:
        type: string
        description: Used for optimistic concurrency.  Must be empty on create, valid on update and delete.
  service-subscriptions:
    description: |
      Collection of objects that group service instances.
    properties:
      service-subscription:
        type: array
        items:
          $ref: "#/definitions/service-subscription"
